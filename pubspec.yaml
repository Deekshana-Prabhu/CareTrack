name: caretrack
description: "CareTrack Mobile-Based Medicine Reminder and Patient Health Monitoring System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Database
  sqflite: ^2.4.1
  path: ^1.9.0

  # Preferences & Storage
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # Notifications & Reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Charts & Health Analytics
  fl_chart: ^0.70.2

  # PDF Reports & Sharing
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4

  # Utilities
  intl: ^0.20.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
